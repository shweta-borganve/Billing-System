name: Python CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
feature/mypy-type-checking
        pip install isort mypy ruff

    - name: Run code quality & type checks

        pip install isort mypy ruff bandit[toml] pip-audit

    - name: Run code quality, type & security checks
main
      run: |
        echo "=== Running isort ==="
        isort --check .
        echo "=== Running black ==="
        black --check .
        echo "=== Running ruff ==="
        ruff check .
        echo "=== Running mypy ==="
        mypy src/
feature/mypy-type-checking

        echo "=== Running bandit ==="
        bandit -r src/
        echo "=== Running pip-audit ==="
        pip-audit
main

    - name: Run unit tests
      run: |
        echo "=== Running unit tests ==="
        PYTHONPATH=. pytest 